services:
  webhook:
    build:
      context: ../..
      dockerfile: alternatives/docker/Dockerfile
    env_file: ../../.env
    restart: unless-stopped
    networks: [private]
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [webhook]
    networks: [private]
networks:
  private:
volumes:
  caddy_data:
  caddy_config:

